<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">PS5 AI MOSS Image architecture</title><desc id="desc">Windows sends authenticated requests to the PS5 OpenAI gateway on 8193. The same PS5 runs MOSS, GGML, Vulkan, RADV and AGC on its GPU, then returns PNG. WebSrv on 8080 is preserved.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#259f9a"/></marker></defs>
<rect width="1200" height="380" rx="22" fill="#f0fbfa"/>
<rect x="30" y="88" width="230" height="200" rx="18" fill="white" stroke="#60bdb8" stroke-width="2"/>
<rect x="300" y="30" width="870" height="320" rx="20" fill="#e0f4f1" stroke="#60bdb8" stroke-width="2"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#153e4a">
<text x="145" y="127" font-size="24" font-weight="700">Windows client</text>
<text x="145" y="170" font-size="18">PowerShell / OpenAI SDK</text>
<text x="145" y="205" font-size="18">Build · Deploy · Download</text>
<text x="145" y="258" font-size="17" fill="#42646e">Inference runs on PS5</text>
<text x="733" y="66" font-size="23" font-weight="700">PlayStation 5 · Native application · FW 12.40 tested</text>
<rect x="325" y="105" width="245" height="180" rx="14" fill="white"/>
<text x="448" y="141" font-size="20" font-weight="700">OpenAI gateway</text><text x="448" y="178" font-size="18">HTTP :8193 · CPU process</text>
<text x="448" y="213" font-size="16">/v1/images/generations</text><text x="448" y="251" font-size="16">Bearer token · LAN only</text>
<rect x="610" y="105" width="260" height="180" rx="14" fill="white"/>
<text x="740" y="141" font-size="20" font-weight="700">MOSS Image + SD.cpp</text><text x="740" y="178" font-size="18">Native async API :8192</text>
<text x="740" y="213" font-size="17">CPU Qwen · GGML Vulkan</text><text x="740" y="251" font-size="17">Jobs · PNG · TV status</text>
<rect x="910" y="105" width="235" height="180" rx="14" fill="#183f4b"/>
<g fill="white"><text x="1028" y="141" font-size="20" font-weight="700">PS5 GPU</text><text x="1028" y="178" font-size="18">RADV / AGC Compute</text><text x="1028" y="213" font-size="17">MOSS DiT · FLUX.2 VAE</text><text x="1028" y="251" font-size="17">10 GiB shared Direct pool</text></g>
<text x="735" y="323" font-size="16">Existing WebSrv :8080 preserved · Bounded journals · PNG remains on PS5</text>
</g>
